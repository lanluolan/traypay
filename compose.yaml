name: traypay

x-mysql: &mysql
  image: mysql:8.4.11
  command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
  healthcheck:
    test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 30s

services:
  mysql:
    <<: *mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup-mysql.ps1 first}
      MYSQL_DATABASE: payment
      MYSQL_USER: checkout
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/setup-mysql.ps1 first}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mysql-test:
    <<: *mysql
    profiles: [test]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Run scripts/setup-mysql.ps1 first}
      MYSQL_DATABASE: payment_test
      MYSQL_USER: checkout_test
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Run scripts/setup-mysql.ps1 first}
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql

volumes:
  mysql_data:
